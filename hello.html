<!DOCTYPE html>
<html lang="en">
    <head>
    </head>
    <body>
        <h1 id="s">hi shahana</h1>
        <p>Welcome</p>
        <P class="title">mern stack internship</P>
        <h3 >kavisri</h3>
        <h3 >dhanya</h3>
        <h3 >kavya</h3>
        <h3 >tharunika</h3>
        <button id="btn">click</button>
        <h4 id="helo">button color changed</h4>
        <button id="btn1">click</button>
        <h5 id="text"></h5>

    </body>
    <script>
        document.getElementById("s").style.color="red";
        let elements=document.getElementsByClassName("title");
        for(let i=0;i<elements.length;i++){
            elements[i].style.backgroundColor="green";
            elements[i].style.fontSize="50px";
        }
        //let elements=document.getElementByClassName("title")
        //document.getElementsByTagName("p").style.fontSize="100px";
        let ele=document.querySelectorAll("h3");
        for(let i=0;i<ele.length;i++){
            ele[i].style.color="green";
        }
        let elem=document.getElementById("btn")
        elem.addEventListener("click",()=>{
            document.getElementById("helo").style.color="red"
        })
        let elem1=document.getElementById("btn1")
        elem1.addEventListener("mouseover",()=>{
            document.getElementById("text").innerHTML="interesting"
        })
        
    </script>
</html>
